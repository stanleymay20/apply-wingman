name: Temporary dependency repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-apply-wingman-dependency-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/recruiter-facing-readme-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate safe dependency resolutions
        run: npm audit fix --force || true

      - name: Require production audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Require full-tree high-severity audit
        run: npm audit --audit-level=high

      - name: Require lint
        run: npm run lint

      - name: Require production build
        run: npm run build

      - name: Commit repaired dependency files only
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Repair audited npm dependency tree"
          git push origin HEAD:${{ github.head_ref }}
